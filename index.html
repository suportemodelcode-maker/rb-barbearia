<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RB Barbearia | Agendamento</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #fafafa; }
    .font-elegant { font-family: 'Playfair Display', serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input { font-size: 16px !important; }
  </style>
</head>
<body class="antialiased min-h-screen flex justify-center bg-zinc-950">

  <div class="w-full max-w-md bg-zinc-950 min-h-screen shadow-2xl relative flex flex-col">
    
    <!-- Hero Header (Estilo App Premium) -->
    <header class="relative h-60 shrink-0">
      <img src="https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=800&q=80" alt="Interior Barbearia" class="absolute inset-0 w-full h-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-zinc-950 via-zinc-950/60 to-zinc-950/10"></div>
      
      <!-- Top Bar -->
      <div class="absolute top-0 w-full p-4 flex justify-between items-center">
        <span class="px-3 py-1 bg-zinc-950/50 backdrop-blur-md rounded-full text-xs font-medium text-zinc-300 border border-zinc-800/50">Aberto hoje</span>
      </div>

      <!-- Titulo -->
      <div class="absolute bottom-6 left-6 right-6">
        <h1 class="font-elegant text-4xl text-white tracking-wide shadow-black drop-shadow-md">RB <span class="text-amber-500 italic">Barbearia</span></h1>
        <p class="text-zinc-400 text-sm mt-1">Sua rotina, refinada.</p>
      </div>
    </header>

    <!-- ETAPA 1: Serviços -->
    <div id="step-1" class="flex-1 overflow-y-auto px-6 pb-24 pt-6 space-y-6 no-scrollbar">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold text-white tracking-tight">Nossos Serviços</h2>
        <span class="text-xs text-amber-500 font-medium bg-amber-500/10 px-2 py-1 rounded-md">Escolha 1</span>
      </div>

      <div class="space-y-4">
        <!-- Serviço 1 -->
        <label class="block relative p-3 rounded-2xl border border-zinc-800 bg-zinc-900/50 hover:border-amber-500/50 cursor-pointer transition-all has-[:checked]:border-amber-500 has-[:checked]:bg-amber-500/5">
          <input type="radio" name="service" value="Corte" data-price="40" data-time="30 min" class="peer sr-only" onchange="enableNext(1)">
          <div class="flex items-center gap-4">
            <img src="https://images.unsplash.com/photo-1599351431202-1e0f0137899a?w=200&q=80" class="w-16 h-16 rounded-xl object-cover shadow-md" alt="Corte">
            <div class="flex-1">
              <p class="font-bold text-white text-base">Corte Clássico</p>
              <p class="text-zinc-400 text-xs mt-0.5">Tesoura ou Máquina</p>
              <div class="flex items-center gap-2 mt-1.5">
                <span class="text-[10px] text-zinc-500 flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> 30 min</span>
              </div>
            </div>
            <p class="text-amber-400 font-bold text-lg">R$ 40</p>
          </div>
        </label>

        <!-- Serviço 2 -->
        <label class="block relative p-3 rounded-2xl border border-zinc-800 bg-zinc-900/50 hover:border-amber-500/50 cursor-pointer transition-all has-[:checked]:border-amber-500 has-[:checked]:bg-amber-500/5">
          <input type="radio" name="service" value="Barba" data-price="30" data-time="30 min" class="peer sr-only" onchange="enableNext(1)">
          <div class="flex items-center gap-4">
            <img src="https://images.unsplash.com/photo-1621605815971-fbc98d665033?w=200&q=80" class="w-16 h-16 rounded-xl object-cover shadow-md" alt="Barba">
            <div class="flex-1">
              <p class="font-bold text-white text-base">Barba Completa</p>
              <p class="text-zinc-400 text-xs mt-0.5">Modelagem e toalha quente</p>
              <div class="flex items-center gap-2 mt-1.5">
                <span class="text-[10px] text-zinc-500 flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> 30 min</span>
              </div>
            </div>
            <p class="text-amber-400 font-bold text-lg">R$ 30</p>
          </div>
        </label>

        <!-- Serviço 3 -->
        <label class="block relative p-3 rounded-2xl border border-zinc-800 bg-zinc-900/50 hover:border-amber-500/50 cursor-pointer transition-all has-[:checked]:border-amber-500 has-[:checked]:bg-amber-500/5">
          <input type="radio" name="service" value="Sobrancelha" data-price="15" data-time="15 min" class="peer sr-only" onchange="enableNext(1)">
          <div class="flex items-center gap-4">
            <img src="https://images.unsplash.com/photo-1634449278211-b962ba6e1919?w=200&q=80" class="w-16 h-16 rounded-xl object-cover shadow-md" alt="Sobrancelha">
            <div class="flex-1">
              <p class="font-bold text-white text-base">Sobrancelha</p>
              <p class="text-zinc-400 text-xs mt-0.5">Alinhamento na navalha</p>
              <div class="flex items-center gap-2 mt-1.5">
                <span class="text-[10px] text-zinc-500 flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> 15 min</span>
              </div>
            </div>
            <p class="text-amber-400 font-bold text-lg">R$ 15</p>
          </div>
        </label>

        <!-- Serviço 4 -->
        <label class="block relative p-3 rounded-2xl border border-amber-500/40 bg-gradient-to-r from-zinc-900 to-amber-950/20 hover:border-amber-500 cursor-pointer transition-all has-[:checked]:border-amber-500 has-[:checked]:bg-amber-500/10">
          <input type="radio" name="service" value="Combo Corte + Barba" data-price="65" data-time="1 hora" class="peer sr-only" onchange="enableNext(1)">
          <div class="absolute -top-3 left-4 bg-amber-500 text-zinc-950 text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-wider shadow-lg">Mais Pedido</div>
          <div class="flex items-center gap-4 mt-2">
            <img src="https://images.unsplash.com/photo-1585747860715-2ba37e788b70?w=200&q=80" class="w-16 h-16 rounded-xl object-cover shadow-md" alt="Combo">
            <div class="flex-1">
              <p class="font-bold text-white text-base">Combo Completo</p>
              <p class="text-zinc-400 text-xs mt-0.5">Corte + Barba VIP</p>
              <div class="flex items-center gap-2 mt-1.5">
                <span class="text-[10px] text-zinc-500 flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> 1 hora</span>
              </div>
            </div>
            <p class="text-amber-400 font-bold text-lg">R$ 65</p>
          </div>
        </label>
      </div>
    </div>

    <!-- Barra Fixa Inferior Etapa 1 -->
    <div id="footer-step-1" class="absolute bottom-0 w-full p-6 bg-gradient-to-t from-zinc-950 via-zinc-950 to-transparent pt-12">
      <button id="btn-next-1" disabled onclick="goToStep(2)" class="w-full py-4 rounded-2xl font-bold text-zinc-500 bg-zinc-900 border border-zinc-800 disabled:opacity-50 transition-all flex justify-center items-center gap-2">
        Avançar para Agendamento
      </button>
    </div>

    <!-- ETAPA 2: Data e Hora -->
    <div id="step-2" class="flex-1 overflow-y-auto px-6 pb-24 pt-6 hidden flex-col no-scrollbar bg-zinc-950 z-10 absolute inset-0">
      <header class="flex items-center gap-4 mb-8">
        <button onclick="goToStep(1)" class="w-10 h-10 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400 hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <h2 class="text-xl font-bold text-white tracking-tight">Data e Horário</h2>
      </header>

      <div class="flex gap-3 overflow-x-auto no-scrollbar pb-2" id="date-container"></div>

      <div class="mt-8 mb-4 flex items-center justify-between">
        <p class="text-sm font-semibold text-zinc-300">Horários disponíveis</p>
        <span class="text-xs text-amber-500 px-2 py-1 bg-amber-500/10 rounded-md font-medium border border-amber-500/20">Das 18h às 22h</span>
      </div>

      <div class="grid grid-cols-3 gap-3" id="time-container"></div>
    </div>

    <!-- Barra Fixa Inferior Etapa 2 -->
    <div id="footer-step-2" class="absolute bottom-0 w-full p-6 bg-gradient-to-t from-zinc-950 via-zinc-950 to-transparent pt-12 hidden z-20">
      <button id="btn-next-2" disabled onclick="goToStep(3)" class="w-full py-4 rounded-2xl font-bold text-zinc-500 bg-zinc-900 border border-zinc-800 disabled:opacity-50 transition-all flex justify-center items-center gap-2">
        Revisar Agendamento
      </button>
    </div>

    <!-- ETAPA 3: Dados do Cliente -->
    <div id="step-3" class="flex-1 overflow-y-auto px-6 pb-24 pt-6 hidden flex-col no-scrollbar bg-zinc-950 z-30 absolute inset-0">
      <header class="flex items-center gap-4 mb-8">
        <button onclick="goToStep(2)" class="w-10 h-10 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400 hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <h2 class="text-xl font-bold text-white tracking-tight">Confirmação</h2>
      </header>

      <div class="bg-zinc-900/50 border border-zinc-800 rounded-2xl p-5 mb-8 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-24 h-24 bg-amber-500/10 rounded-full blur-2xl -mr-10 -mt-10"></div>
        <p class="text-xs text-zinc-500 uppercase tracking-widest mb-3 font-semibold">Resumo do Pedido</p>
        <div class="flex justify-between items-end border-b border-zinc-800/50 pb-4 mb-4">
            <div>
                <p class="font-bold text-white text-lg" id="summary-service">Corte</p>
                <div class="flex items-center gap-2 text-sm text-zinc-400 mt-1">
                    <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <span id="summary-datetime"></span>
                </div>
            </div>
            <p class="text-amber-400 font-bold text-xl" id="summary-price">R$ 40</p>
        </div>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-2 uppercase tracking-wider">Seu Nome Completo</label>
          <input type="text" id="clientName" placeholder="Ex: João da Silva" class="w-full px-5 py-4 bg-zinc-900 border border-zinc-800 rounded-2xl text-white placeholder-zinc-600 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all" onkeyup="enableNext(3)">
        </div>
      </div>
    </div>

    <!-- Barra Fixa Inferior Etapa 3 -->
    <div id="footer-step-3" class="absolute bottom-0 w-full p-6 bg-gradient-to-t from-zinc-950 via-zinc-950 to-transparent pt-12 hidden z-40">
      <button id="btn-finish" disabled onclick="finishBooking()" class="w-full py-4 rounded-2xl font-bold text-zinc-950 bg-amber-500 hover:bg-amber-400 disabled:opacity-50 transition-all flex justify-center items-center gap-2 shadow-[0_0_20px_rgba(245,158,11,0.25)]">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12.01 2.01c-5.52 0-10 4.48-10 10 0 1.95.56 3.78 1.54 5.31L2.2 22l4.82-1.35c1.48.88 3.19 1.36 5.01 1.36 5.51 0 10-4.48 10-10s-4.48-10-10.02-10zm5.66 14.54c-.26.74-1.52 1.4-2.12 1.47-.5.06-1.15.17-3.32-.73-2.61-1.09-4.32-3.8-4.45-3.98-.13-.17-1.07-1.42-1.07-2.72s.67-1.95.91-2.21c.23-.25.51-.31.68-.31s.34 0 .49.02c.16.02.38-.06.59.45.22.53.71 1.73.78 1.86.06.13.11.28.02.47-.08.18-.13.3-.26.45-.13.15-.27.33-.39.45-.13.13-.27.27-.12.53.15.26.66 1.1 1.42 1.78.98.88 1.81 1.15 2.07 1.28.26.13.41.11.57-.08.15-.2.66-.77.84-1.04.18-.26.36-.22.59-.13.23.09 1.48.7 1.74.83.25.13.43.2.49.31.06.11.06.64-.2 1.38z"/></svg>
        Confirmar no WhatsApp
      </button>
    </div>

  </div>

  <script>
    let booking = { service: '', price: 0, duration: '', date: '', dateLabel: '', time: '', client: '' };

    function generateDates() {
      const container = document.getElementById('date-container');
      const diasSemana = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
      let html = ''; let addDays = 0; let count = 0;

      while(count < 6) {
        let d = new Date(); d.setDate(d.getDate() + addDays);
        if (d.getDay() !== 0) {
          let dayName = diasSemana[d.getDay()]; let dayNum = d.getDate(); let month = d.getMonth() + 1;
          let fullDate = `${dayNum}/${month}/${d.getFullYear()}`; let displayStr = `${dayName}, ${dayNum}/${month}`;
          html += `
            <label class="shrink-0 w-[72px] h-24 rounded-2xl border border-zinc-800 bg-zinc-900/50 flex flex-col items-center justify-center cursor-pointer transition-all has-[:checked]:border-amber-500 has-[:checked]:bg-amber-500/10 hover:border-amber-500/30">
              <input type="radio" name="date" value="${fullDate}" data-label="${displayStr}" class="peer sr-only" onchange="enableNext(2)">
              <span class="text-xs text-zinc-500 peer-checked:text-amber-500 font-medium uppercase tracking-wide">${dayName}</span>
              <span class="text-2xl font-bold text-white peer-checked:text-amber-400 mt-1">${dayNum}</span>
            </label>
          `;
          count++;
        }
        addDays++;
      }
      container.innerHTML = html;
    }

    function generateTimes() {
      const container = document.getElementById('time-container');
      const times = ['18:00', '18:30', '19:00', '19:30', '20:00', '20:30', '21:00', '21:30', '22:00'];
      let html = '';
      times.forEach(t => {
        html += `
          <label class="py-4 rounded-2xl border border-zinc-800 bg-zinc-900/50 text-center cursor-pointer transition-all has-[:checked]:border-amber-500 has-[:checked]:bg-amber-500 text-zinc-400 has-[:checked]:text-zinc-950 has-[:checked]:font-bold hover:border-amber-500/30 font-medium">
            <input type="radio" name="time" value="${t}" class="peer sr-only" onchange="enableNext(2)">
            ${t}
          </label>
        `;
      });
      container.innerHTML = html;
    }

    function enableNext(step) {
      if (step === 1) {
        const selected = document.querySelector('input[name="service"]:checked');
        if (selected) {
          booking.service = selected.value; booking.price = selected.dataset.price; booking.duration = selected.dataset.time;
          let btn = document.getElementById('btn-next-1');
          btn.disabled = false;
          btn.className = "w-full py-4 rounded-2xl font-bold text-zinc-950 bg-amber-500 hover:bg-amber-400 transition-all flex justify-center items-center gap-2 shadow-[0_0_15px_rgba(245,158,11,0.2)]";
        }
      }
      if (step === 2) {
        const date = document.querySelector('input[name="date"]:checked'); const time = document.querySelector('input[name="time"]:checked');
        if (date && time) {
          booking.date = date.value; booking.dateLabel = date.dataset.label; booking.time = time.value;
          let btn = document.getElementById('btn-next-2');
          btn.disabled = false;
          btn.className = "w-full py-4 rounded-2xl font-bold text-zinc-950 bg-amber-500 hover:bg-amber-400 transition-all flex justify-center items-center gap-2 shadow-[0_0_15px_rgba(245,158,11,0.2)]";
        }
      }
      if (step === 3) {
        const nome = document.getElementById('clientName').value;
        document.getElementById('btn-finish').disabled = nome.trim().length < 3;
      }
    }

    function goToStep(step) {
      document.getElementById('step-1').classList.add('hidden'); document.getElementById('footer-step-1').classList.add('hidden');
      document.getElementById('step-2').classList.add('hidden'); document.getElementById('footer-step-2').classList.add('hidden');
      document.getElementById('step-3').classList.add('hidden'); document.getElementById('footer-step-3').classList.add('hidden');
      
      if(step === 1) { document.getElementById('footer-step-1').classList.remove('hidden'); }
      if(step === 2) { generateDates(); generateTimes(); document.getElementById('footer-step-2').classList.remove('hidden'); }
      if(step === 3) {
        document.getElementById('summary-service').innerText = booking.service;
        document.getElementById('summary-price').innerText = `R$ ${booking.price}`;
        document.getElementById('summary-datetime').innerText = `${booking.dateLabel} às ${booking.time}`;
        document.getElementById('footer-step-3').classList.remove('hidden');
      }

      const target = document.getElementById(`step-${step}`);
      target.classList.remove('hidden'); target.classList.add('flex');
    }
  </script>
</body>
</html>
