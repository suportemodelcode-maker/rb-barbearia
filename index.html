<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RB Barbearia | App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #fafafa; }
    .font-elegant { font-family: 'Playfair Display', serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input, select { font-size: 16px !important; }
  </style>
</head>
<body class="antialiased min-h-screen flex justify-center bg-zinc-950 select-none">

  <div class="w-full max-w-md bg-zinc-950 min-h-screen shadow-2xl relative flex flex-col overflow-hidden">
    
    <!-- TELA DE LOGIN -->
    <div id="view-login" class="flex flex-col items-center justify-center min-h-screen p-6 z-50 bg-zinc-950 absolute inset-0">
      <div class="w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center mb-6">
        <svg class="w-8 h-8 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.121 14.121L19 19m-7-7l7-7m-7 7l-2.879 2.879a3 3 0 11-4.242-4.242L10.5 8.5m3.621 5.621l-5.621-5.621"/></svg>
      </div>
      <h1 class="font-elegant text-4xl text-white text-center">RB <span class="text-amber-500 italic">Barbearia</span></h1>
      <p class="text-zinc-400 text-sm mt-2 mb-10 text-center">Agendamento online exclusivo</p>
      
      <button onclick="signInWithGoogle()" class="w-full py-4 px-6 rounded-2xl font-bold text-zinc-950 bg-white hover:bg-zinc-200 transition-all flex justify-center items-center gap-3 shadow-lg">
        <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Entrar com Google
      </button>
    </div>

    <!-- ETAPA 1: SERVIÇOS -->
    <div id="step-services" class="hidden flex-col h-full pb-28 overflow-y-auto no-scrollbar">
      <header class="relative h-56 shrink-0">
        <img src="https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=800&q=80" alt="Barbearia" class="absolute inset-0 w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-zinc-950 via-zinc-950/60 to-transparent"></div>
        <div class="absolute top-4 left-6 right-6 flex justify-between items-center">
          <span class="px-3 py-1 bg-zinc-950/60 backdrop-blur-md rounded-full text-[11px] font-semibold text-emerald-400 border border-emerald-500/20">Aberto hoje</span>
          <img id="nav-avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&q=80" class="w-8 h-8 rounded-full border border-amber-500/40 object-cover cursor-pointer" onclick="switchTab('profile')">
        </div>
        <div class="absolute bottom-4 left-6">
          <h1 class="font-elegant text-3xl text-white">RB <span class="text-amber-500 italic">Barbearia</span></h1>
          <p class="text-zinc-400 text-xs mt-0.5">Selecione o serviço para agendar</p>
        </div>
      </header>

      <div class="p-6 space-y-3">
        <!-- Corte Clássico -->
        <label class="block relative p-3 rounded-2xl border border-zinc-800/80 bg-zinc-900/40 cursor-pointer has-[:checked]:border-amber-500 has-[:checked]:bg-amber-500/10 transition-all">
          <input type="radio" name="service" value="Corte Clássico" data-price="40" data-duration="30 min" class="peer sr-only" onchange="enableBookingBtn()">
          <div class="flex items-center gap-3.5">
            <img src="https://images.unsplash.com/photo-1599351431202-1e0f0137899a?w=200&q=80" class="w-14 h-14 rounded-xl object-cover" alt="Corte">
            <div class="flex-1">
              <p class="font-bold text-white text-sm">Corte Clássico</p>
              <p class="text-zinc-400 text-xs mt-0.5">Tesoura ou máquina</p>
              <p class="text-zinc-500 text-[11px] mt-1">🕒 30 min</p>
            </div>
            <p class="text-amber-400 font-bold text-base">R$ 40</p>
          </div>
        </label>

        <!-- Barba Completa -->
        <label class="block relative p-3 rounded-2xl border border-zinc-800/80 bg-zinc-900/40 cursor-pointer has-[:checked]:border-amber-500 has-[:checked]:bg-amber-500/10 transition-all">
          <input type="radio" name="service" value="Barba Completa" data-price="30" data-duration="30 min" class="peer sr-only" onchange="enableBookingBtn()">
          <div class="flex items-center gap-3.5">
            <img src="https://images.unsplash.com/photo-1621605815971-fbc98d665033?w=200&q=80" class="w-14 h-14 rounded-xl object-cover" alt="Barba">
            <div class="flex-1">
              <p class="font-bold text-white text-sm">Barba Completa</p>
              <p class="text-zinc-400 text-xs mt-0.5">Toalha quente e navalha</p>
              <p class="text-zinc-500 text-[11px] mt-1">🕒 30 min</p>
            </div>
            <p class="text-amber-400 font-bold text-base">R$ 30</p>
          </div>
        </label>

        <!-- Sobrancelha -->
        <label class="block relative p-3 rounded-2xl border border-zinc-800/80 bg-zinc-900/40 cursor-pointer has-[:checked]:border-amber-500 has-[:checked]:bg-amber-500/10 transition-all">
          <input type="radio" name="service" value="Sobrancelha" data-price="15" data-duration="15 min" class="peer sr-only" onchange="enableBookingBtn()">
          <div class="flex items-center gap-3.5">
            <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=200&q=80" class="w-14 h-14 rounded-xl object-cover" alt="Sobrancelha">
            <div class="flex-1">
              <p class="font-bold text-white text-sm">Sobrancelha</p>
              <p class="text-zinc-400 text-xs mt-0.5">Alinhamento na navalha</p>
              <p class="text-zinc-500 text-[11px] mt-1">🕒 15 min</p>
            </div>
            <p class="text-amber-400 font-bold text-base">R$ 15</p>
          </div>
        </label>

        <!-- Combo Corte + Barba -->
        <label class="block relative p-3 rounded-2xl border border-amber-500/30 bg-gradient-to-r from-zinc-900/60 to-amber-950/20 cursor-pointer has-[:checked]:border-amber-500 has-[:checked]:bg-amber-500/10 transition-all">
          <div class="absolute -top-2.5 right-4 bg-amber-500 text-zinc-950 text-[9px] font-extrabold px-2 py-0.5 rounded-full uppercase tracking-wider">Mais pedido</div>
          <input type="radio" name="service" value="Combo Corte + Barba" data-price="65" data-duration="1 hora" class="peer sr-only" onchange="enableBookingBtn()">
          <div class="flex items-center gap-3.5">
            <img src="https://images.unsplash.com/photo-1585747860715-2ba37e788b70?w=200&q=80" class="w-14 h-14 rounded-xl object-cover" alt="Combo">
            <div class="flex-1">
              <p class="font-bold text-white text-sm">Combo Corte + Barba</p>
              <p class="text-zinc-400 text-xs mt-0.5">Experiência completa</p>
              <p class="text-zinc-500 text-[11px] mt-1">🕒 1 hora</p>
            </div>
            <p class="text-amber-400 font-bold text-base">R$ 65</p>
          </div>
        </label>
      </div>

      <div class="fixed bottom-16 max-w-md w-full p-4 bg-gradient-to-t from-zinc-950 via-zinc-950/95 to-transparent">
        <button id="btn-to-step-datetime" disabled onclick="goToDateTime()" class="w-full py-4 rounded-2xl font-bold text-zinc-500 bg-zinc-900 border border-zinc-800 disabled:opacity-40 transition-all">
          Avançar para Horário
        </button>
      </div>
    </div>

    <!-- ETAPA 2: DATA E HORA -->
    <div id="step-datetime" class="hidden flex-col h-full pb-28 overflow-y-auto no-scrollbar p-6">
      <header class="flex items-center gap-4 mb-6">
        <button onclick="switchTab('booking')" class="w-10 h-10 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400 hover:text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <h2 class="text-xl font-bold text-white">Escolha Data e Hora</h2>
      </header>

      <p class="text-xs font-semibold text-zinc-400 mb-3 uppercase tracking-wider">Próximos Dias</p>
      <div class="flex gap-2.5 overflow-x-auto no-scrollbar pb-4" id="date-scroll-container"></div>

      <div class="mt-6 mb-3 flex items-center justify-between">
        <p class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Horários Noturnos</p>
        <span class="text-[10px] text-amber-500 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20">A partir das 18h</span>
      </div>
      <div class="grid grid-cols-3 gap-2.5" id="time-grid-container"></div>

      <div class="fixed bottom-16 max-w-md w-full left-1/2 -translate-x-1/2 p-4 bg-gradient-to-t from-zinc-950 via-zinc-950/95 to-transparent">
        <button id="btn-save-appointment" disabled onclick="confirmBooking()" class="w-full py-4 rounded-2xl font-bold text-zinc-950 bg-amber-500 hover:bg-amber-400 disabled:opacity-40 transition-all flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(245,158,11,0.25)]">
          Confirmar Agendamento
        </button>
      </div>
    </div>

    <!-- TELA 3: PERFIL E HISTÓRICO -->
    <div id="view-profile" class="hidden flex-col h-full pb-28 p-6 overflow-y-auto no-scrollbar">
      <h1 class="text-2xl font-bold text-white mb-6">Meu Perfil</h1>
      
      <div class="flex items-center gap-5 bg-zinc-900/50 border border-zinc-800/80 p-4 rounded-2xl mb-6">
        <div class="relative w-16 h-16 shrink-0">
          <img id="avatar-img" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&q=80" class="w-16 h-16 rounded-full object-cover border-2 border-amber-500/50">
          <input type="file" id="file-avatar" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" onchange="uploadAvatar(event)">
          <div class="absolute bottom-0 right-0 bg-amber-500 p-1 rounded-full text-zinc-950">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          </div>
        </div>
        <div class="flex-1 overflow-hidden">
          <p id="profile-name" class="font-bold text-white text-base truncate">Carregando...</p>
          <p id="profile-email" class="text-xs text-zinc-400 truncate">...</p>
        </div>
      </div>

      <div class="space-y-2 mb-8">
        <label class="text-xs font-semibold text-zinc-400 uppercase tracking-wider block">Telefone / WhatsApp</label>
        <div class="flex gap-2">
          <input type="text" id="profile-phone" class="flex-1 px-4 py-3 bg-zinc-900 border border-zinc-800 rounded-xl text-white outline-none focus:border-amber-500 text-sm" placeholder="(51) 99999-9999">
          <button onclick="savePhone()" class="px-4 bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold rounded-xl text-xs transition-colors">Salvar</button>
        </div>
      </div>

      <h2 class="text-sm font-semibold text-zinc-400 uppercase tracking-wider mb-3">Histórico de Cortes</h2>
      <div id="history-container" class="space-y-2.5 flex-1"></div>

      <button onclick="userSignOut()" class="mt-8 text-xs font-bold text-red-400 py-3 border border-red-500/20 rounded-xl bg-red-500/5 hover:bg-red-500/10 transition-colors text-center w-full">
        Encerrar Sessão
      </button>
    </div>

    <!-- BARRA INFERIOR -->
    <div id="bottom-bar" class="hidden fixed bottom-0 max-w-md w-full bg-zinc-950/90 backdrop-blur-md border-t border-zinc-800 flex justify-around p-3 z-40">
      <button onclick="switchTab('booking')" id="nav-btn-book" class="flex flex-col items-center gap-1 text-amber-500 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <span class="text-[10px] font-semibold">Agendar</span>
      </button>
      <button onclick="switchTab('profile')" id="nav-btn-prof" class="flex flex-col items-center gap-1 text-zinc-500 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-[10px] font-semibold">Perfil</span>
      </button>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://cifrmupwumffzrcqwfjv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_AcMuSuUE6DK5gGQ9eStmMw_muIgJsG6';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let user = null;
    let selectedService = null;
    let selectedPrice = null;
    let selectedDate = null;
    let selectedTime = null;

    sb.auth.onAuthStateChange(async (event, session) => {
      if (session) {
        user = session.user;
        document.getElementById('view-login').classList.add('hidden');
        document.getElementById('bottom-bar').classList.remove('hidden');
        await syncUserProfile();
        loadHistory();
        switchTab('booking');
      } else {
        user = null;
        document.getElementById('view-login').classList.remove('hidden');
        document.getElementById('step-services').classList.add('hidden');
        document.getElementById('step-datetime').classList.add('hidden');
        document.getElementById('view-profile').classList.add('hidden');
        document.getElementById('bottom-bar').classList.add('hidden');
      }
    });

    async function signInWithGoogle() {
      await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin }
      });
    }

    async function userSignOut() {
      await sb.auth.signOut();
    }

    function switchTab(tab) {
      document.getElementById('step-services').classList.add('hidden');
      document.getElementById('step-datetime').classList.add('hidden');
      document.getElementById('view-profile').classList.add('hidden');

      const btnBook = document.getElementById('nav-btn-book');
      const btnProf = document.getElementById('nav-btn-prof');

      if (tab === 'booking') {
        document.getElementById('step-services').classList.remove('hidden');
        document.getElementById('step-services').classList.add('flex');
        btnBook.className = 'flex flex-col items-center gap-1 text-amber-500 transition-colors';
        btnProf.className = 'flex flex-col items-center gap-1 text-zinc-500 transition-colors';
      } else if (tab === 'profile') {
        document.getElementById('view-profile').classList.remove('hidden');
        document.getElementById('view-profile').classList.add('flex');
        btnProf.className = 'flex flex-col items-center gap-1 text-amber-500 transition-colors';
        btnBook.className = 'flex flex-col items-center gap-1 text-zinc-500 transition-colors';
        loadHistory();
      }
    }

    async function syncUserProfile() {
      const metaName = user.user_metadata?.full_name || 'Cliente';
      const metaAvatar = user.user_metadata?.avatar_url || '';
      
      document.getElementById('profile-name').innerText = metaName;
      document.getElementById('profile-email').innerText = user.email;

      const { data } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();

      if (!data) {
        await sb.from('profiles').upsert([{ 
          id: user.id, 
          full_name: metaName, 
          avatar_url: metaAvatar, 
          phone: '' 
        }]);
        if (metaAvatar) {
          document.getElementById('avatar-img').src = metaAvatar;
          document.getElementById('nav-avatar').src = metaAvatar;
        }
      } else {
        if (data.phone) document.getElementById('profile-phone').value = data.phone;
        const currentAvatar = data.avatar_url || metaAvatar;
        if (currentAvatar) {
          document.getElementById('avatar-img').src = currentAvatar;
          document.getElementById('nav-avatar').src = currentAvatar;
        }
      }
    }

    async function savePhone() {
      const phone = document.getElementById('profile-phone').value.trim();
      const { error } = await sb.from('profiles').update({ phone: phone }).eq('id', user.id);
      if (error) {
        alert('Erro ao salvar telefone: ' + error.message);
      } else {
        alert('Telefone atualizado com sucesso!');
      }
    }

    async function uploadAvatar(e) {
      const file = e.target.files[0];
      if (!file) return;

      const fileExt = file.name.split('.').pop();
      const fileName = `${user.id}-${Date.now()}.${fileExt}`;

      const { error: uploadErr } = await sb.storage.from('avatars').upload(fileName, file, { upsert: true });
      if (uploadErr) {
        alert('Falha no upload da foto: ' + uploadErr.message);
        return;
      }

      const { data: publicUrlData } = sb.storage.from('avatars').getPublicUrl(fileName);
      const avatarUrl = publicUrlData.publicUrl;

      await sb.from('profiles').update({ avatar_url: avatarUrl }).eq('id', user.id);
      document.getElementById('avatar-img').src = avatarUrl;
      document.getElementById('nav-avatar').src = avatarUrl;
    }

    function enableBookingBtn() {
      const radio = document.querySelector('input[name="service"]:checked');
      if (radio) {
        selectedService = radio.value;
        selectedPrice = radio.dataset.price;
        const btn = document.getElementById('btn-to-step-datetime');
        btn.disabled = false;
        btn.className = 'w-full py-4 rounded-2xl font-bold text-zinc-950 bg-amber-500 hover:bg-amber-400 transition-all shadow-[0_0_15px_rgba(245,158,11,0.25)]';
      }
    }

    function goToDateTime() {
      document.getElementById('step-services').classList.add('hidden');
      document.getElementById('step-datetime').classList.remove('hidden');
      document.getElementById('step-datetime').classList.add('flex');
      renderDateOptions();
      renderTimeOptions();
    }

    function renderDateOptions() {
      const container = document.getElementById('date-scroll-container');
      const dias = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
      let html = '';
      let added = 0;
      let offset = 0;

      while (added < 6) {
        let d = new Date();
        d.setDate(d.getDate() + offset);
        if (d.getDay() !== 0) {
          let dayName = dias[d.getDay()];
          let dayNum = d.getDate();
          let month = d.getMonth() + 1;
          let val = `${dayNum}/${month}/${d.getFullYear()}`;
          html += `
            <label class="shrink-0 w-16 h-20 rounded-2xl border border-zinc-800 bg-zinc-900/50 flex flex-col items-center justify-center cursor-pointer transition-all has-[:checked]:border-amber-500 has-[:checked]:bg-amber-500/10">
              <input type="radio" name="book_date" value="${val}" class="peer sr-only" onchange="checkDateTimeSelection()">
              <span class="text-[11px] text-zinc-500 peer-checked:text-amber-500 uppercase font-semibold">${dayName}</span>
              <span class="text-xl font-bold text-white peer-checked:text-amber-400 mt-1">${dayNum}</span>
            </label>
          `;
          added++;
        }
        offset++;
      }
      container.innerHTML = html;
    }

    function renderTimeOptions() {
      const container = document.getElementById('time-grid-container');
      const slots = ['18:00', '18:30', '19:00', '19:30', '20:00', '20:30', '21:00', '21:30', '22:00'];
      let html = '';
      slots.forEach(slot => {
        html += `
          <label class="py-3 rounded-xl border border-zinc-800 bg-zinc-900/50 text-center cursor-pointer transition-all has-[:checked]:border-amber-500 has-[:checked]:bg-amber-500 text-zinc-400 has-[:checked]:text-zinc-950 font-semibold text-sm">
            <input type="radio" name="book_time" value="${slot}" class="peer sr-only" onchange="checkDateTimeSelection()">
            ${slot}
          </label>
        `;
      });
      container.innerHTML = html;
    }

    function checkDateTimeSelection() {
      const d = document.querySelector('input[name="book_date"]:checked');
      const t = document.querySelector('input[name="book_time"]:checked');
      const btn = document.getElementById('btn-save-appointment');
      if (d && t) {
        selectedDate = d.value;
        selectedTime = t.value;
        btn.disabled = false;
      }
    }

    async function confirmBooking() {
      const { error } = await sb.from('appointments').insert([{
        user_id: user.id,
        service: selectedService,
        price: parseFloat(selectedPrice),
        date: selectedDate,
        time: selectedTime
      }]);

      if (error) {
        alert('Erro detalhado: ' + error.message);
        return;
      }

      const phoneBarber = "5551995738595";
      const userName = document.getElementById('profile-name').innerText;
      const msg = `✂️ *NOVO AGENDAMENTO | RB Barbearia*\n\n👤 *Cliente:* ${userName}\n💈 *Serviço:* ${selectedService}\n📅 *Data:* ${selectedDate}\n⏰ *Horário:* ${selectedTime}\n💵 *Valor:* R$ ${selectedPrice},00`;
      
      window.open(`https://api.whatsapp.com/send?phone=${phoneBarber}&text=${encodeURIComponent(msg)}`, '_blank');
      switchTab('profile');
    }

    async function loadHistory() {
      const container = document.getElementById('history-container');
      const { data, error } = await sb.from('appointments').select('*').eq('user_id', user.id).order('created_at', { ascending: false });

      if (error || !data || data.length === 0) {
        container.innerHTML = `<p class="text-xs text-zinc-600 text-center py-6">Nenhum corte agendado até o momento.</p>`;
        return;
      }

      let html = '';
      data.forEach(item => {
        html += `
          <div class="p-3.5 bg-zinc-900/60 border border-zinc-800/80 rounded-xl flex justify-between items-center">
            <div>
              <p class="font-bold text-white text-xs">${item.service}</p>
              <p class="text-zinc-400 text-[11px] mt-0.5">${item.date} às ${item.time}</p>
            </div>
            <p class="text-amber-400 font-bold text-xs">R$ ${item.price}</p>
          </div>
        `;
      });
      container.innerHTML = html;
    }
  </script>
</body>
</html>
